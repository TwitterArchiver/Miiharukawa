  <div class="tweet-content">
  其实我们这种自学画画的人才是最心虚的，别人画画什么专业词汇全蹦出来了，一到别人问我你怎么画的，我只会说看顺眼就行。第一个发明液化的人真是天才，比例一不对我就液液液，比例实在不行就自己下场啦。每次对着镜子做出搔首弄姿的动作，床上的螨虫都要笑死了，什么亮灰暗面更是一脸懵。别人画画全靠眼力，而我画画只有审美，一不顺眼就液液液液液液液，什么视觉重心上色都不会。二分是自己想象的，下笔是赌的，颜色是蒙的，技巧全靠手P，突出了我的画技之低——其实我们自学画画的，才是赌神来的。
