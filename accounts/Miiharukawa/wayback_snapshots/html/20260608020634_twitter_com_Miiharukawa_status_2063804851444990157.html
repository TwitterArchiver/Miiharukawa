  小猫刚睡醒是特别好闻的时候。全身睡得滚烫，小猫味也是最浓烈，捧在手里只会噜噜的响着，四肢毫无力气只能任由摆布。就像是捧着一块美味佳肴，从触摸开始，再到观赏，等到饱览眼福之后，就可以开始细细品味浓烈的小猫味。将鼻子缓缓埋进它的肚子里，随着小猫的呼吸一鼓又一鼓，极致的柔软触感，极致的浓烈小猫味，深深的，悠扬的，对鼻子施加最巅峰的感官刺激，此刻我的脑子一片空白，仿佛已经被多巴胺冲毁了大脑。此时此刻，脑子里只有深深呼吸，极致品味小猫的浓烈欲望。可能世间最顶级的美味，莫过于此了
